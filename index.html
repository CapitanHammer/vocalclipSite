<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VocalClip — Buffer Audio 30s per Discord</title>
  <style>
    :root {
      --bg: #070908;
      --bg-card: #0e1310;
      --bg-card-2: #151917;
      --border: #1e2d24;
      --border-muted: #2d3330;
      --border-gold: rgba(234, 179, 8, 0.35);
      --text: #f3f6f4;
      --muted: #9aa8a0;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --emerald-glow: rgba(16, 185, 129, 0.22);
      --gold: #eab308;
      --gold-soft: rgba(234, 179, 8, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at 75% 10%, rgba(16, 185, 129, 0.14), transparent 42%),
        radial-gradient(circle at 20% 20%, rgba(234, 179, 8, 0.07), transparent 38%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Navbar */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(12px);
      background: rgba(7, 9, 8, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 68px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .badge-buffer {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.14);
      color: var(--emerald-bright);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: 0.92rem;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.94rem;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--emerald);
      color: #04130d;
      box-shadow: 0 8px 24px var(--emerald-glow);
    }

    .btn-primary:hover {
      background: var(--emerald-bright);
    }

    .btn-gray {
      background: var(--bg-card-2);
      color: var(--text);
      border-color: var(--border-muted);
    }

    .btn-gray:hover {
      background: #1d221f;
      border-color: var(--border-gold);
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 0.84rem;
      border-radius: 8px;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.32);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    /* Hero */
    .hero {
      padding: 72px 0 56px;
      text-align: center;
    }

    .pill-gold {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #fde047;
      background: var(--gold-soft);
      border: 1px solid var(--border-gold);
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(2.1rem, 5vw, 3.6rem);
      line-height: 1.12;
      letter-spacing: -0.02em;
      max-width: 820px;
      margin: 0 auto 18px;
    }

    h1 .accent {
      color: var(--emerald-bright);
    }

    .hero p {
      max-width: 650px;
      margin: 0 auto 28px;
      color: var(--muted);
      font-size: 1.02rem;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* Sections */
    section {
      padding: 52px 0;
    }

    .section-head {
      margin-bottom: 24px;
    }

    .section-head h2 {
      font-size: 1.65rem;
      margin-bottom: 6px;
    }

    .section-head p {
      color: var(--muted);
      font-size: 0.96rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }

    .cmd-name {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--emerald-bright);
      font-size: 1.08rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card h3 {
      font-size: 1.12rem;
      margin-bottom: 8px;
    }

    .card p, .card li {
      color: var(--muted);
      font-size: 0.93rem;
    }

    .card ul {
      padding-left: 18px;
    }

    .card li + li {
      margin-top: 6px;
    }

    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: var(--emerald-bright);
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 10px;
    }

    /* Dashboard */
    .dashboard-section {
      padding: 56px 0;
    }

    .dashboard-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 16px;
      padding: 24px;
    }

    .dash-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .dash-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .clip-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .clip-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      background: #0a0d0b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .clip-meta strong {
      display: block;
      font-size: 0.98rem;
      color: var(--text);
    }

    .clip-meta span {
      font-size: 0.84rem;
      color: var(--muted);
    }

    .clip-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty-state {
      text-align: center;
      padding: 28px 16px;
      color: var(--muted);
      background: #0a0d0b;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    /* FAQ */
    .faq-item + .faq
